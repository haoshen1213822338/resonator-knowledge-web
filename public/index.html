<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公司知识问答</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%239fd8c2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas class="resonance-canvas" id="resonance-canvas" aria-hidden="true"></canvas>

    <main class="app-shell">
      <aside class="left-rail">
        <header class="site-brand" aria-label="共振体 Resonator">
          <div class="brand-wordmark">
            <span class="brand-cn">共振体</span>
            <span class="brand-divider"></span>
            <span class="brand-en">RESONATOR</span>
          </div>
          <span class="brand-tag">COMMUNICATION</span>
        </header>

        <label class="rail-select">
          <span>项目库</span>
          <select id="space-select"></select>
        </label>

        <nav class="rail-actions" aria-label="知识库操作">
          <button type="button" class="primary-button" id="new-chat">新建对话</button>
          <a class="ghost-button link-button" href="/admin">资料后台</a>
          <button type="button" class="ghost-button" id="refresh-status">刷新状态</button>
        </nav>

        <section class="history-block" aria-labelledby="history-title">
          <div class="section-label" id="history-title">历史对话</div>
          <div id="chat-sessions" class="chat-sessions empty">暂无历史对话。</div>
        </section>
      </aside>

      <section class="chat-workspace" aria-labelledby="page-title">
        <div class="workspace-head">
          <div>
            <p class="eyebrow">AI 共振家</p>
            <h1 id="page-title">公司知识问答</h1>
          </div>
          <p class="subtitle">用本地资料连续追问、检索和整理，回答保留来源。</p>
        </div>

        <article class="answer-panel" aria-live="polite">
          <div class="chat-header">
            <div>
              <div class="section-label">当前对话</div>
              <p id="chat-title" class="chat-title">新对话</p>
            </div>
          </div>
          <div id="conversation" class="conversation empty">等待你的问题。</div>
          <div id="answer" class="answer hidden"></div>
        </article>

        <form id="ask-form" class="composer">
          <textarea
            id="question"
            name="question"
            rows="3"
            placeholder="输入问题，按 Enter 发送，Shift + Enter 换行"
            required
          ></textarea>
          <div class="composer-actions">
            <button type="button" class="ghost-button compact-button" id="sample-button">
              示例
            </button>
            <button type="submit" class="primary-button compact-button">发送</button>
          </div>
        </form>
      </section>

      <aside class="right-rail front-right-rail" aria-label="引用来源">
        <section class="source-panel">
          <div class="section-label">引用来源</div>
          <div id="sources" class="sources empty">回答后会显示来源文件。</div>
        </section>
      </aside>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
